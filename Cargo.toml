[package]
name = "botdo"
version = "0.1.0"
edition = "2021"
description = "Mint a short-lived, repo-scoped GitHub App token and run a gh command with it"

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

[profile.release]
opt-level = "z"
lto = true
strip = true
