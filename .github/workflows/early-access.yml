name: Early Access

on:
  workflow_dispatch:
    inputs:
      currentDevelopmentVersion:
        description: Current development version (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: early-access-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
    env:
      VERSION: ${{ inputs.currentDevelopmentVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "botdo") | .version')
          if [ "$version" != "$VERSION" ]; then
            echo "Requested version $VERSION does not match botdo version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="botdo-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$archive"
          install -m 0755 target/release/botdo "dist/$archive/botdo"
          cp LICENSE README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: botdo-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish rolling early-access release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.currentDevelopmentVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: botdo-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums_sha256.txt

      - name: Publish prerelease
        run: |
          gh release delete early-access --cleanup-tag --yes || true
          gh release create early-access dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "botdo ${VERSION} early access" \
            --notes "Early-access build of botdo ${VERSION} from commit ${GITHUB_SHA}. This build is intended for testing and is not a stable release."
